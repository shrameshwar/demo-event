name: Events Demo 1
on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
  push:
    branches:
      - main #main
      - 'dev-*' # dev-new dev-this
      - 'dev/**' #dev/new  dev/new/button  it will trigger when on these branches will be pushed
    paths-ignore:
      - '.github/workflows/*' # event will not trigger on push of above braches as well if change will be only on workflow file.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."